name = "doer-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"] # reminders, token refresh, watch renewal (Phase 4+)

# Abuse protection (Cloudflare rate-limit bindings; counted per key, per Cloudflare location).
[[ratelimits]]
name = "AUTH_LIMITER" # sign-in / sign-up attempts, keyed by client IP
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "API_LIMITER" # authenticated API traffic, keyed by user
namespace_id = "1002"
simple = { limit = 300, period = 60 }

[vars]
BETTER_AUTH_URL = "https://doer-api.martin-pavic97.workers.dev"
WEB_ORIGIN = "https://doer-web.pages.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
